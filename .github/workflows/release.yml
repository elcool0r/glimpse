name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      # Runs natively on the runner's own architecture (amd64), regardless of
      # which arch this matrix leg is cross-compiling for below -- a cross-
      # compiled arm64 test binary cannot execute on an amd64 runner.
      - name: Test
        run: go test ./...

      # internal/version/VERSION is the single source of truth for the
      # binary's version; the tag is only how a release gets triggered.
      # Failing fast here beats shipping a binary whose --version disagrees
      # with the release it was attached to.
      - name: Verify VERSION matches the tag
        run: |
          version="$(tr -d '[:space:]' < internal/version/VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "internal/version/VERSION is $version but the pushed tag is v$tag" >&2
            exit 1
          fi

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/glimpse-linux-${{ matrix.goarch }}" ./cmd/glimpse

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: dist/glimpse-linux-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # id-token is required to sign the build provenance attestation;
    # attestations is what records it against this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true

      # The README tells users to curl a binary into /usr/local/bin with sudo,
      # and the result is frequently run as root. Without a published digest
      # there is no way for them to tell a genuine artifact from a substituted
      # one, so ship the checksums alongside the binaries.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum glimpse-linux-* > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373b6df2d78c99998eaad6a4d9d3e72806d # v2.4.0
        with:
          subject-path: dist/glimpse-linux-*

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*
          generate_release_notes: true
